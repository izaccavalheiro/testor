# Release (VERSIONING.md).
#
# A version is published from GitHub, never from a laptop: push a tag v<version> on a commit
# whose orchestrator/mix.exs says <version> and whose CHANGELOG.md has its section. Then this
# workflow
#
#   1. runs the whole CI pipeline on the tagged commit (Windows, Linux, macOS);
#   2. checks that the tag, mix.exs and the changelog agree, and that a stable version is
#      tagged on a commit of main;
#   3. builds the release on each OS, packs it with the runner's scripts (run.ps1, install.ps1,
#      setup.ps1), SHA256 sums and an SPDX SBOM, and attests the provenance of every file and
#      the SBOM of the archives (`gh attestation verify <file> --repo <owner>/testor`);
#   4. creates the GitHub release, with the changelog section as notes (a version with a
#      pre-release suffix, such as 1.0.0-rc.1, is marked as a pre-release).

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - name: Check the tag against mix.exs and CHANGELOG.md
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"
      - name: A stable version is tagged on main
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "pre-release: any branch" ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::stable tags must be on main"; exit 1; } ;;
          esac

  build:
    name: Build (${{ matrix.os }})
    needs: [verify, check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-2025, target: windows-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: macos-15, target: macos-arm64 }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Build the release
        working-directory: orchestrator
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite
      - name: Pack it
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $name = "testor-$version-${{ matrix.target }}"
          $null = New-Item -ItemType Directory dist
          tar -czf "dist/$name.tar.gz" -C orchestrator/_build/prod/rel testor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: The runner's scripts, so an install never fetches them from a branch
        run: cp runner/run.ps1 runner/install.ps1 runner/setup.ps1 dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.ps1 > SHA256SUMS
      - name: SBOM of the orchestrator's dependencies (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: orchestrator
          format: spdx-json
          output-file: dist/testor.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.ps1
            dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/testor.spdx.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.ps1 dist/testor.spdx.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "testor ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease
