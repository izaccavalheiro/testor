# Release (VERSIONING.md).
#
# A version is published from GitHub, never from a laptop: push a tag v<version> on a commit
# whose orchestrator/mix.exs says <version> and whose CHANGELOG.md has its section. Then this
# workflow
#
#   1. runs the whole CI pipeline on the tagged commit (Windows, Linux, macOS);
#   2. checks that the tag, mix.exs and the changelog agree, and that a stable version is
#      tagged on a commit of main;
#   3. builds the release on each OS, packs it with the runner's scripts (run.ps1, install.ps1,
#      setup.ps1), SHA256 sums and an SPDX SBOM, and attests the provenance of every file and
#      the SBOM of the archives (`gh attestation verify <file> --repo <owner>/testor`);
#   4. creates the GitHub release, with the changelog section as notes (a version with a
#      pre-release suffix, such as 1.0.0-rc.1, is marked as a pre-release);
#   5. publishes the Helm chart as an OCI artifact, oci://ghcr.io/<owner>/charts/testor at the
#      version, signed with cosign keyless (the Terraform module installs it from there):
#      `cosign verify ghcr.io/<owner>/charts/testor:<version> --certificate-identity-regexp
#      'https://github.com/<owner>/testor/' --certificate-oidc-issuer
#      https://token.actions.githubusercontent.com`.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - name: Check the tag against mix.exs and CHANGELOG.md
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"
      - name: A stable version is tagged on main
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "pre-release: any branch" ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::stable tags must be on main"; exit 1; } ;;
          esac

  build:
    name: Build (${{ matrix.os }})
    needs: [verify, check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-2025, target: windows-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: macos-15, target: macos-arm64 }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Build the release
        working-directory: orchestrator
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite
      - name: Pack it
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $name = "testor-$version-${{ matrix.target }}"
          $null = New-Item -ItemType Directory dist
          tar -czf "dist/$name.tar.gz" -C orchestrator/_build/prod/rel testor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: The runner's scripts, so an install never fetches them from a branch
        run: cp runner/run.ps1 runner/agent.ps1 runner/install.ps1 runner/setup.ps1 runner/snapshot.ps1 runner/testor.ps1 runner/detect.ps1 dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.ps1 > SHA256SUMS
      - name: SBOM of the orchestrator's dependencies (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: orchestrator
          format: spdx-json
          output-file: dist/testor.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.ps1
            dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/testor.spdx.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.ps1 dist/testor.spdx.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "testor ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease

  chart:
    name: Publish the Helm chart (OCI)
    needs: [verify, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      HELM: alpine/helm@sha256:8191701ad1f82ee3695c87211fcbfe6d7b1bb7df92ac1c8de9ccdb0995a6a2c1 # 3.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Package the chart at the tag's version, push it to ghcr.io
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/helm" dist
          helm() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/helm -v "$RUNNER_TEMP/helm:/helm" -v "$PWD:/w" -w /w "$HELM" "$@"; }
          helm package deploy/helm/testor --version "$version" --app-version "$version" -d dist
          # The credentials as `helm registry login` would keep them: its login probe asks ghcr.io
          # for a token of another scope, which the workflow's token is denied (403).
          mkdir -p "$RUNNER_TEMP/helm/.config/helm/registry"
          printf '{"auths": {"ghcr.io": {"auth": "%s"}}}' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 -w0)" \
            > "$RUNNER_TEMP/helm/.config/helm/registry/config.json"
          helm push "dist/testor-$version.tgz" "oci://ghcr.io/${OWNER,,}/charts" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)
          test -n "$digest"
          echo "ref=ghcr.io/${OWNER,,}/charts/testor@$digest" >> "$GITHUB_OUTPUT"
      - name: Sign it (cosign keyless)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
