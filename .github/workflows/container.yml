# The orchestrator's OCI image (orchestrator/Dockerfile), for linux/amd64 and linux/arm64.
#
#   pull requests that touch it   build both platforms and run the container's health probe;
#                                 nothing is pushed
#   a tag v<version>              push ghcr.io/<owner>/testor:<version> (and :latest for a
#                                 stable version) and attest its build provenance, so
#                                 `gh attestation verify oci://...` checks where it came from

name: Container

on:
  pull_request:
    paths: ["orchestrator/**", "runner/run.ps1", "scripts/two-accounts/**", ".github/workflows/container.yml"]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build${{ startsWith(github.ref, 'refs/tags/') && ' and publish' || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check the image starts and answers its health probe
        run: |
          docker buildx build --load -t testor:ci orchestrator
          docker run -d --name testor --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges testor:ci
          for i in $(seq 1 30); do
            docker exec testor /app/bin/testor eval 'Testor.Probe.check()' && exit 0
            sleep 2
          done
          docker logs testor
          exit 1

      - name: Tests in a separate account (docs/security.md)
        run: |
          # The docker driver (builder "default") sees testor:ci in the engine; the
          # docker-container builder setup-buildx makes current does not.
          docker buildx build --builder default --load --build-arg BASE=testor:ci -f scripts/two-accounts/Dockerfile \
            -t testor:two-accounts .
          docker run --rm --user root --entrypoint bash testor:two-accounts /scenario.sh

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/testor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: orchestrator
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags || 'testor:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/testor
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

