# The orchestrator's and the agent's OCI images (orchestrator/Dockerfile, runner/Dockerfile).
#
#   pull requests that touch it   build them for linux/amd64 and test them (health probe, two
#                                 accounts, the agent's and the cluster's end to end); nothing
#                                 is pushed
#   a tag v<version>              build each for linux/amd64 and linux/arm64 on runners of that
#                                 platform (native arm64), check them there, push
#                                 ghcr.io/<owner>/testor[-agent]:<version> (and :latest for a
#                                 stable version) as one index, and attest its build provenance,
#                                 so `gh attestation verify oci://...` checks where it came from

name: Container

on:
  pull_request:
    paths: ["orchestrator/**", "runner/**", "scripts/two-accounts/**", "scripts/container-e2e.sh", "scripts/cluster-e2e.sh", "scripts/storage-e2e.sh", "scripts/snapshot-e2e.sh", "deploy/helm/**", "deploy/terraform/**", "scripts/terraform-e2e.sh", "scripts/acme-e2e.sh", ".github/workflows/container.yml"]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every pull request, push and tag: the amd64 images, built and tested (no QEMU, no arm64:
  # arm64 is built natively, on tags only, below).
  image:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check the image starts and answers its health probe
        run: |
          docker buildx build --load -t testor:ci orchestrator
          docker run -d --name testor --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges testor:ci
          for i in $(seq 1 30); do
            docker exec testor /app/bin/testor eval 'Testor.Probe.check()' && exit 0
            sleep 2
          done
          docker logs testor
          exit 1

      - name: Tests in a separate account (docs/security.md)
        run: |
          # The docker driver (builder "default") sees testor:ci in the engine; the
          # docker-container builder setup-buildx makes current does not.
          docker buildx build --builder default --load --build-arg BASE=testor:ci -f scripts/two-accounts/Dockerfile \
            -t testor:two-accounts .
          docker run --rm --user root --entrypoint bash testor:two-accounts /scenario.sh

      - name: A job run by the agent image, its run sent to testor (scripts/container-e2e.sh)
        run: |
          docker buildx build --builder default --load -f runner/Dockerfile -t testor-agent:ci .
          scripts/container-e2e.sh testor:ci testor-agent:ci

      - name: Snapshots and incremental state (scripts/snapshot-e2e.sh)
        run: scripts/snapshot-e2e.sh testor:ci testor-agent:ci

      - name: Two testors on one home and one PostgreSQL (scripts/cluster-e2e.sh)
        run: scripts/cluster-e2e.sh testor:ci testor-agent:ci

      - name: Two testors with no shared volume, runs in S3 (scripts/storage-e2e.sh)
        run: scripts/storage-e2e.sh testor:ci testor-agent:ci

      - name: Certificates from ACME, issued and renewed by Pebble (scripts/acme-e2e.sh)
        run: scripts/acme-e2e.sh testor:ci

      - name: The Terraform module on kind (scripts/terraform-e2e.sh)
        run: scripts/terraform-e2e.sh testor:ci

  # Tags: each image for each platform on a runner of that platform (native arm64, no QEMU),
  # checked there, pushed by digest with its provenance and SBOM; joined below.
  publish:
    name: Publish ${{ matrix.image }} (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [testor, testor-agent]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { image: testor, context: orchestrator, file: orchestrator/Dockerfile }
          - { image: testor-agent, context: ., file: runner/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check it on its own platform
        run: |
          docker buildx build --load -f ${{ matrix.file }} -t check ${{ matrix.context }}
          if [ "${{ matrix.image }}" = testor ]; then
            docker run -d --name check --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges check
            for i in $(seq 1 30); do docker exec check /app/bin/testor eval 'Testor.Probe.check()' && exit 0; sleep 2; done
            docker logs check; exit 1
          else
            docker run --rm --entrypoint pwsh check -NoProfile -Command '
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile("/opt/testor-agent/agent.ps1", [ref]$null, [ref]$errors)
              if ($errors) { $errors; exit 1 }
              "PowerShell $($PSVersionTable.PSVersion) on $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"'
          fi

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep its digest for the manifest
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      # Named image last: a pattern digest-testor-* would take testor-agent's digests too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.image }}
          path: digests/*
          retention-days: 1

  # Tags: each image's two platforms under its version tags, and the provenance of that index.
  manifest:
    name: Manifest ${{ matrix.image }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [testor, testor-agent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ matrix.image }}
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - id: index
        name: Join the platforms under the version's tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # One digest per platform of this image, no other image's.
          ls digests
          [ "$(ls digests | wc -l)" -eq 2 ] || { echo "expected 2 digests of ${{ matrix.image }}"; exit 1; }
          refs=$(for f in digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          args=$(for t in $TAGS; do printf -- '-t %s ' "$t"; done)
          docker buildx imagetools create $args $refs
          first=$(echo "$TAGS" | head -1)
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HELM: alpine/helm@sha256:8191701ad1f82ee3695c87211fcbfe6d7b1bb7df92ac1c8de9ccdb0995a6a2c1 # 3.22.1
      KUBECONFORM: ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e # v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, render three configurations, validate them against Kubernetes' schemas
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts "$HELM" "$@"; }
          helm lint testor --strict
          mkdir -p out
          helm template t testor -n ci > out/default.yaml
          helm template t testor -n ci --set ingress.enabled=true --set ingress.tlsSecret=web \
            --set tls.existingSecret=tls --set auth.existingSecret=admin \
            --set serviceMonitor.enabled=true --set 'trustedProxies={10.0.0.0/8}' > out/full.yaml
          helm template t testor -n ci --set database.existingSecret=db > out/database.yaml
          grep -q TESTOR_DATABASE_URL out/database.yaml
          helm template t testor -n ci --set database.existingSecret=db --set replicas=3 \
            --set 'persistence.accessModes[0]=ReadWriteMany' > out/replicas.yaml
          grep -q 'replicas: 3' out/replicas.yaml && grep -q RollingUpdate out/replicas.yaml
          ! helm template t testor -n ci --set replicas=3 > /dev/null 2>&1
          # Runs in a bucket: no shared volume, config.json from the chart, one set of keys.
          helm template t testor -n ci --set database.existingSecret=db --set replicas=3 \
            --set storage.s3.bucket=runs --set storage.s3.region=eu-west-1 --set storage.s3.existingSecret=s3 \
            --set keys.existingSecret=keys --set persistence.enabled=false --set config.execution.enabled=true \
            --set 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::1:role/testor' > out/storage.yaml
          grep -q '"bucket": "runs"' out/storage.yaml && grep -q TESTOR_CONFIG_FILE out/storage.yaml
          grep -q TESTOR_SIGNING_KEY out/storage.yaml && ! grep -q PersistentVolumeClaim out/storage.yaml
          ! helm template t testor -n ci --set database.existingSecret=db --set replicas=3 \
            --set storage.s3.bucket=runs --set storage.s3.region=r > /dev/null 2>&1
          ! helm template t testor -n ci --set persistence.enabled=false > /dev/null 2>&1
          ! helm template t testor -n ci --set storage.s3.bucket=runs > /dev/null 2>&1
          helm template t testor -n ci --set persistence.existingClaim=data \
            --set networkPolicy.enabled=false > out/claim.yaml
          helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t \
            --set agents.projects.web.repository=https://example.com/web.git \
            --set agents.projects.web.commands.test=test --set agents.autoscaling.keda=true > out/agents.yaml
          helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t \
            --set agents.projects.web.commands.test=test --set agents.projects.web.secrets.DB=file:/s/db \
            --set 'agents.secretMounts[0].secret=ci' --set 'agents.secretMounts[0].mountPath=/s' \
            --set 'agents.env[0].name=NPM' --set 'agents.env[0].valueFrom.secretKeyRef.name=ci' \
            --set 'agents.env[0].valueFrom.secretKeyRef.key=npm' --set agents.vault.address=https://vault:8200 \
            --set agents.serviceAccount.create=true --set agents.serviceAccount.automountToken=true \
            --set 'agents.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=ci@p.iam.gserviceaccount.com' \
            > out/agent-secrets.yaml
          helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t \
            --set agents.projects.web.commands.test=test \
            --set 'agents.profiles[0].name=e2e-browser' --set 'agents.profiles[0].labels={linux,browser}' \
            --set 'agents.profiles[0].shmSize=1Gi' --set 'agents.profiles[0].autoscaling.keda=true' \
            --set 'agents.profiles[1].name=mutation-heavy' --set 'agents.profiles[1].labels={linux,mutation}' \
            --set 'agents.profiles[1].mode=job' --set 'agents.profiles[1].workspaceSizeLimit=20Gi' > out/profiles.yaml
          grep -q 'name: t-testor-agent-e2e-browser' out/profiles.yaml && grep -q 'kind: ScaledJob' out/profiles.yaml
          grep -q 'label="browser"' out/profiles.yaml && grep -q 'label="mutation"' out/profiles.yaml && grep -q 'medium: Memory' out/profiles.yaml
          ! helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t --set 'agents.profiles[0].name=Bad_Name' > /dev/null 2>&1
          # Warm agents: a StatefulSet with a volume per pod; never for a Job per run.
          helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t \
            --set agents.projects.web.commands.test=test --set agents.persistence.enabled=true \
            --set agents.autoscaling.keda=true --set 'agents.profiles[0].name=mutation-heavy' \
            --set 'agents.profiles[0].labels={linux,mutation}' --set 'agents.profiles[0].mode=job' > out/warm.yaml
          grep -q 'kind: StatefulSet' out/warm.yaml && grep -q 'volumeClaimTemplates' out/warm.yaml && grep -q 'kind: ScaledJob' out/warm.yaml
          ! helm template t testor -n ci --set agents.enabled=true --set agents.tokenSecret=t --set 'agents.profiles[0].name=m' \
            --set 'agents.profiles[0].labels={linux}' --set 'agents.profiles[0].mode=job' \
            --set 'agents.profiles[0].persistence.enabled=true' > /dev/null 2>&1
          helm template t testor -n ci --set tls.acme.domains[0]=testor.example.com \
            --set tls.acme.httpPort=8080 > out/acme.yaml
          grep -q TESTOR_ACME out/acme.yaml && grep -q acme-http out/acme.yaml
          ! helm template t testor -n ci --set tls.existingSecret=tls --set tls.acme.domains[0]=a.example.com > /dev/null 2>&1
          grep -q '"vault"' out/agent-secrets.yaml && grep -q 'serviceAccountName: t-testor-agent' out/agent-secrets.yaml
          docker run --rm -v "$PWD/out:/m" "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.30.0 -skip ServiceMonitor,ScaledObject,ScaledJob /m/profiles.yaml /m/default.yaml /m/full.yaml /m/claim.yaml /m/agents.yaml /m/agent-secrets.yaml /m/database.yaml /m/replicas.yaml /m/acme.yaml /m/storage.yaml /m/warm.yaml
