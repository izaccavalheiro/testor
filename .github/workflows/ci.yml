name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }}, OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, otp: "29", elixir: "1.20" }
          - { os: windows-2025, otp: "27", elixir: "1.18" }
          - { os: ubuntu-24.04, otp: "29", elixir: "1.20" }
          - { os: macos-15, otp: "29", elixir: "1.20" }
    defaults:
      run:
        shell: pwsh
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            orchestrator/deps
            orchestrator/_build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('orchestrator/mix.lock') }}
      - name: Dependencies
        run: mix deps.get
      - name: Formatting
        run: mix format --check-formatted
      - name: Compile (warnings are errors)
        run: mix compile --warnings-as-errors
      - name: Tests (unit, integration; 100% coverage), in partitions at once
        run: ./test/partitions.ps1
      - name: Release
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite
      - name: Smoke test of the release
        working-directory: .
        run: ./scripts/smoke.ps1 -Release orchestrator/_build/prod/rel/testor
      - name: Install as a service and uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: .
        timeout-minutes: 10
        run: |
          # A user service manager needs lingering (or a login session) on Linux.
          if ($IsLinux) { sudo loginctl enable-linger $env:USER; Start-Sleep -Seconds 2 }
          # install.ps1 expects <home>/src/{orchestrator,runner}; give it that layout.
          $testorHome = Join-Path $HOME "test-run/.testor"
          $src = Join-Path $testorHome "src"
          $null = New-Item -ItemType Directory -Force $src
          # The tracked files only, as `task testor:deploy` uploads them: a recursive copy of the
          # working tree also walks what the tests leave in orchestrator/ (tmp/, _build/), and
          # hung there.
          $archive = Join-Path $env:RUNNER_TEMP "src.tar"
          git archive --format=tar -o $archive HEAD orchestrator runner
          tar -xf $archive -C $src
          & (Join-Path $src "runner/install.ps1") -Port 6798
          & (Join-Path $src "runner/install.ps1") -Uninstall -Port 6798

  postgres:
    # The whole suite with the job queue in PostgreSQL (TESTOR_DATABASE_URL), its own tests
    # included and the coverage gate on its code.
    name: Orchestrator with PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: testor
          POSTGRES_PASSWORD: testor-ci
          POSTGRES_DB: testor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testor" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TESTOR_DATABASE_URL: postgres://testor:testor-ci@localhost:5432/testor
      # One database: partitions at once would empty each other's queue.
      TESTOR_TEST_PARTITIONS: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            orchestrator/deps
            orchestrator/_build
          key: mix-pg-${{ runner.os }}-29-1.20-${{ hashFiles('orchestrator/mix.lock') }}
      - name: Dependencies
        run: mix deps.get
      - name: Compile (warnings are errors)
        run: mix compile --warnings-as-errors
      - name: Tests with the job queue in PostgreSQL (100% coverage), in partitions at once
        run: ./test/partitions.ps1

  brokers:
    name: Job queue on real brokers (ElasticMQ, NATS JetStream)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      TESTOR_BROKERS: "1"
      ELASTICMQ: softwaremill/elasticmq-native@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c # 1.7.1
      NATS: nats@sha256:0764f1952d72e92e35ad8b152da0f9652a49cb1186b6445fdd45131d81ad6d7e # 2.12
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Start the brokers
        run: |
          docker run -d --name elasticmq -p 127.0.0.1:9324:9324 "$ELASTICMQ"
          docker run -d --name nats -p 127.0.0.1:4222:4222 "$NATS" -js
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9324/ && break; sleep 1; done
      - name: Dependencies
        run: mix deps.get
      - name: The queue contract on each broker
        run: mix test --only brokers

  powershell:
    name: PowerShell scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every script with both PowerShells
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -notmatch "\\(_build|deps)\\"
          $check = {
            param($path)
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            $errors | ForEach-Object { "$path`: $($_.Extent.StartLineNumber): $($_.Message)" }
          }
          $bad = foreach ($s in $scripts) {
            & $check $s.FullName
            # setup.ps1 and sysinfo.ps1 run in Windows PowerShell 5.1 too.
            if (-not $IsWindows -or $s.Name -notin "setup.ps1", "sysinfo.ps1") { continue }
            powershell.exe -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$($s.FullName)', [ref]`$null, [ref]`$e); `$e | ForEach-Object { '$($s.Name) (5.1): ' + `$_.Message }"
          }
          if ($bad) { $bad; throw "parse errors" }
          "parsed $($scripts.Count) scripts"
      - name: Scripts the runner's PowerShell 5.1 reads are ASCII
        shell: pwsh
        run: |
          # Windows PowerShell reads a file without a BOM in the ANSI code page.
          $bad = Get-ChildItem runner, orchestrator/priv -Filter *.ps1 | Where-Object { [IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1 }
          if ($bad) { $bad.FullName; throw "non-ASCII characters" }
      - name: setup.ps1 -Check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./runner/setup.ps1 -Check
      - name: setup.ps1 -Check (PowerShell 7)
        shell: pwsh
        run: ./runner/setup.ps1 -Check
      - name: Device sampler answers static and two samples
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "static", "sample full", "sample light" | powershell.exe -NoProfile -ExecutionPolicy Bypass -File orchestrator/priv/sysinfo.ps1
          $lines = @($out | ForEach-Object { $_ | ConvertFrom-Json })
          $lines | ForEach-Object { "$($_.type) in $($_.ms) ms" }
          if ($lines.Count -ne 3 -or $lines[0].type -ne "static" -or $lines[1].type -ne "sample" -or $null -eq $lines[2].cpu) { $out; throw "unexpected sampler output" }

  taskfiles:
    name: Taskfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: The Taskfiles load and list their tasks
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cat > Taskfile.yml <<'EOF'
          version: "3"
          includes:
            testor:
              taskfile: ./taskfiles/testor.yml
              vars: { RUNNER: ci-runner }
          EOF
          task --list
          # Every task's templates render (the remote commands are silent, so nothing is printed).
          for t in check test smoke ci deploy status logs uninstall; do task --dry testor:$t; done
          task --dry testor:test -- test/sessions_test.exs
          cd examples/node-project
          TESTOR_RUNNER=ci-runner task --dry test

  versioning:
    name: Versioning (release tool, changelog, commit subjects)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - name: Tests of scripts/release.mjs
        run: node --test scripts/release.test.mjs
      - name: mix.exs and CHANGELOG.md agree
        run: node scripts/release.mjs check
      - name: Commit subjects are Conventional Commits (VERSIONING.md)
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/release.mjs lint-commits "$RANGE"
      - name: The version the changes since the last release call for
        run: node scripts/release.mjs next >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Documentation site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build (fails on any broken link or anchor)
        run: npm run build
