name: Feature request
description: Something testor should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Say if it touches a public surface (the API, MCP tools, run records, Taskfile variables, configuration).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
