# Runs a project's checks on a testor runner (Windows, Linux or macOS, with PowerShell 7) over
# SSH. Include it from the project's Taskfile (internal: its tasks are building blocks):
#
#   includes:
#     runner:
#       taskfile: ~/git/testor/taskfiles/remote.yml
#       internal: true
#       vars: { RUNNER: my-runner }
#
#   tasks:
#     test:
#       cmds:
#         - task: runner:sync            # upload the working tree (once per `task` call)
#         - task: runner:npm-ci          # optional: npm ci when package-lock.json changed
#         - task: runner:exec
#           vars: { KIND: test, CMD: "npm test -- {{.CLI_ARGS}}" }
#     coverage:
#       cmds:
#         - task: runner:sync
#         - task: runner:exec
#           vars: { KIND: coverage, CMD: "npm run test:coverage", ARTIFACTS: "coverage" }
#
# sync uploads the working tree as git sees it (tracked and untracked files, uncommitted
# changes included, minus what .gitignore excludes) to ~/<WORKSPACES>/<PROJECT> on the runner,
# deleting the previous snapshot's files except KEEP (dependencies and build caches). Only what
# changed travels: git hashes the tree into a throwaway index (no objects written), the runner
# compares it with the manifest of its last sync (<HOME_DIR>/manifests/<PROJECT>.json) and the
# files as they are there, and asks for the files it lacks; SYNC=full sends the whole tree, as
# before 0.18. SYNC=cas sends it to testor instead (SERVER, a token in TESTOR_TOKEN), as a
# content-addressed snapshot an agent runs (runner/snapshot.ps1; needs pwsh here), and with KIND
# queues that task (LABELS: an agent's labels). exec runs
# CMD there in PowerShell 7, stopping at the first failing command, whatever the runner's
# operating system or login shell. With KIND, the command runs through testor's run.ps1, so
# the run shows on the dashboard; output, stderr and exit code are passed through unchanged.
# ARTIFACTS (with KIND): space-separated files and folders, relative to the project, wildcards
# allowed, unquoted (coverage playwright-report reports/*.md), that the run writes and the dashboard
# keeps with it: HTML reports, coverage, Markdown, JUnit XML, ...
# TIMEOUT (with KIND): the run's longest time (600, 90s, 45m, 2h): its process tree is then
# ended and the run recorded failed, reason timeout. MEMORY_GUARD (with KIND): "80,92", the
# shares of memory (the cgroup's limit on Linux) at which it warns, then ends the run.
# LOCK (with KIND, 1 by default): one run of the project at a time on the runner, the next one
# waiting (shown "waiting"); LOCK=0 lets them overlap in one folder. ISOLATE=copy: each run in a
# copy of the snapshot of its own (KEEP folders linked, not copied), deleted when it ends, so
# runs of one project overlap safely; the dependency install stays one at a time.
# REPORTS (with KIND): files testor reads when the run ends, the same way (a mutation report:
# reports/mutation/mutation.json); see docs/mutation.md.
#
# Vars: RUNNER (required, an SSH host), PROJECT (default: the git root's folder name),
# ROOT (default: the git root of the directory `task` was called from), WORKSPACES
# (test-run), HOME_DIR (<WORKSPACES>/.testor; both relative to the runner's home folder or
# absolute), KEEP (node_modules .lockhash target .venv: names kept at any depth, or paths
# from the project's root such as reports/stryker-incremental.json), PRESERVE (paths kept as
# caches between syncs, which CLEAN=1 drops first: .stryker-tmp reports/stryker-incremental.json),
# ACTOR (who the runs are recorded as started by; default <user>@<workstation>).
#
# The workstation needs ssh, git and tar (GNU tar, bsdtar or Windows' tar.exe). Scripts reach
# the runner base64-encoded, so no quoting depends on the runner's shell.
version: "3"

# go-task gives an included Taskfile's own vars precedence over the ones passed to it, so the
# values computed here have names of their own (_ROOT, ...) and read the caller's with defaults.
vars:
  _ROOT:
    sh: '{{if .ROOT}}echo "{{.ROOT}}"{{else}}git -C "{{.USER_WORKING_DIR}}" rev-parse --show-toplevel{{end}}'
  _PROJECT: '{{.PROJECT | default (base ._ROOT)}}'
  _WORKSPACES: '{{.WORKSPACES | default "test-run"}}'
  _HOME_DIR: '{{.HOME_DIR | default (printf "%s/.testor" ._WORKSPACES)}}'
  # Who starts the runs, as the runner records it (informative: the SSH account is the proof).
  _ACTOR:
    sh: '{{if .ACTOR}}echo "{{.ACTOR}}"{{else}}echo "${USER:-$USERNAME}@$(hostname)"{{end}}'
  # The commit the snapshot is of, its branch, and whether it has changes not committed.
  _COMMIT:
    sh: 'git -C "{{._ROOT}}" rev-parse HEAD 2>/dev/null || true'
  _BRANCH:
    sh: 'git -C "{{._ROOT}}" rev-parse --abbrev-ref HEAD 2>/dev/null || true'
  _DIRTY:
    sh: 'if [ -n "$(git -C "{{._ROOT}}" status --porcelain 2>/dev/null)" ]; then echo true; else echo false; fi'
  # When that commit was made (lead time for changes, /api/v1/projects/<p>/dora).
  _COMMITTED:
    sh: 'git -C "{{._ROOT}}" log -1 --format=%cI 2>/dev/null || true'
  _KEEP: '{{range $i, $k := splitList " " (.KEEP | default "node_modules .lockhash target .venv")}}{{if $i}}, {{end}}"{{$k}}"{{end}}'
  # TIMEOUT (with KIND): seconds, or 90s, 45m, 2h; MEMORY_GUARD: "warn,stop" percentages. Only
  # digits and a comma reach the runner.
  _TIMEOUT: '{{$t := (.TIMEOUT | default "" | trim)}}{{if regexMatch "^[0-9]+$" $t}}{{$t}}{{else if regexMatch "^[0-9]+s$" $t}}{{trimSuffix "s" $t}}{{else if regexMatch "^[0-9]+m$" $t}}{{mul (trimSuffix "m" $t | atoi) 60}}{{else if regexMatch "^[0-9]+h$" $t}}{{mul (trimSuffix "h" $t | atoi) 3600}}{{else}}0{{end}}'
  _MEMORY_GUARD: '{{regexFind "^[0-9]{1,3},[0-9]{1,3}$" (.MEMORY_GUARD | default "" | replace " " "")}}'
  # Caches a tool keeps between runs (Stryker's incremental file), paths relative to the project;
  # CLEAN=1 drops them before the sync.
  _PRESERVE: '{{range $i, $k := splitList " " (.PRESERVE | default "")}}{{if $i}}, {{end}}"{{$k}}"{{end}}'
  _SYNC: '{{if eq (.SYNC | default "") "full"}}full{{else if eq (.SYNC | default "") "cas"}}cas{{else}}delta{{end}}'
  # Every remote script starts with this: stop on errors (native commands too), UTF-8 output,
  # and on Windows the PATH that sshd's sessions miss (programs installed after sshd started).
  _PRELUDE: |
    $ErrorActionPreference = "Stop"
    $PSNativeCommandUseErrorActionPreference = $true
    try { [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false) } catch { }
    if ($IsWindows) { $env:Path += ";" + [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User") }
    # Relative to the home folder, or absolute (a testor home the test account cannot change).
    $workspace = Join-Path ([IO.Path]::Combine($HOME, "{{._WORKSPACES}}")) "{{._PROJECT}}"
    $testorRun = Join-Path ([IO.Path]::Combine($HOME, "{{._HOME_DIR}}")) "run.ps1"
    $env:TESTOR_ACTOR = '{{._ACTOR | replace "'" "''"}}'
    $env:TESTOR_COMMIT = '{{._COMMIT}}'
    $env:TESTOR_BRANCH = '{{._BRANCH | replace "'" "''"}}'
    $env:TESTOR_DIRTY = '{{._DIRTY}}'
    $env:TESTOR_COMMITTED_AT = '{{._COMMITTED}}'

tasks:
  sync:
    run: once
    cmds:
      - task: 'sync-{{._SYNC}}'

  sync-cas:
    internal: true
    requires:
      vars: [SERVER]
    cmds:
      - cmd: >-
          pwsh -NoProfile -NonInteractive -File "{{.TASKFILE_DIR}}/../runner/snapshot.ps1"
          -Server "{{.SERVER}}" -Project "{{._PROJECT}}" -Path "{{._ROOT}}"
          {{if .KIND}}-Kind "{{.KIND}}"{{end}}{{if .LABELS}} -Labels {{range $i, $l := splitList " " (.LABELS | trim)}}{{if $i}},{{end}}"{{$l}}"{{end}}{{end}}

  # The tree's files as git hashes them, into an index of their own (git's objects untouched).
  sync-delta:
    internal: true
    requires:
      vars: [RUNNER]
    vars:
      _GIT_DIR:
        sh: 'git -C "{{._ROOT}}" rev-parse --absolute-git-dir'
    cmds:
      - cmd: GIT_INDEX_FILE="{{._GIT_DIR}}/testor-sync.index" git -C "{{._ROOT}}" read-tree --empty
        silent: true
      - cmd: >-
          git -C "{{._ROOT}}" ls-files -z --cached --others --exclude-standard |
          GIT_INDEX_FILE="{{._GIT_DIR}}/testor-sync.index" git -C "{{._ROOT}}" update-index -z --add --remove --info-only --stdin
        silent: true
      # 1. The manifest goes over; the runner answers with the files it lacks.
      - task: ps
        vars:
          LABEL: "sync {{._ROOT}} -> ~/{{._WORKSPACES}}/{{._PROJECT}} (changed files)"
          STDIN: 'GIT_INDEX_FILE="{{._GIT_DIR}}/testor-sync.index" git -C "{{._ROOT}}" ls-files -s -z'
          OUT: '> "{{._GIT_DIR}}/testor-sync.need"'
          SCRIPT: |
            # Entries "<mode> <sha-1> <stage>\t<path>", NUL-separated: git's hash of each file.
            $in = [IO.MemoryStream]::new()
            [Console]::OpenStandardInput().CopyTo($in)
            $wanted = [ordered]@{}
            foreach ($entry in ([Text.Encoding]::UTF8.GetString($in.ToArray()) -split "`0")) {
              if ($entry -match "^\d+ ([0-9a-f]{40,64}) \d+`t(.+)$") { $wanted[$Matches[2]] = $Matches[1] }
            }
            $manifests = Join-Path (Split-Path $testorRun) "manifests"
            $null = New-Item -ItemType Directory -Force $manifests
            $last = @{}
            $file = Join-Path $manifests "{{._PROJECT}}.json"
            if ((Test-Path $file) -and (Test-Path $workspace)) { try { $last = Get-Content -Raw $file | ConvertFrom-Json -AsHashtable } catch { } }
            # git's hash of a file as it is here: for one a run changed since the last sync.
            $sha1 = [Security.Cryptography.SHA1]::Create()
            function Get-GitHash([string]$path) {
              $bytes = [IO.File]::ReadAllBytes($path)
              $head = [Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)`0")
              ($sha1.ComputeHash([byte[]]($head + $bytes)) | ForEach-Object { $_.ToString("x2") }) -join ""
            }
            $need = [Collections.Generic.List[string]]::new()
            foreach ($path in $wanted.Keys) {
              $here = Get-Item -LiteralPath (Join-Path $workspace $path) -Force -ErrorAction SilentlyContinue
              $was = $last[$path]
              $same = $here -and -not $here.PSIsContainer -and $was -and $was.sha -eq $wanted[$path] -and (
                ($was.size -eq $here.Length -and $was.ticks -eq $here.LastWriteTimeUtc.Ticks) -or (Get-GitHash $here.FullName) -eq $wanted[$path])
              if (-not $same) { $need.Add($path) }
            }
            # Kept until the files arrive (step 2).
            ConvertTo-Json -InputObject $wanted -Compress | Set-Content (Join-Path $manifests "{{._PROJECT}}.pending.json")
            [Console]::Error.WriteLine("[{{.RUNNER}}] $($need.Count) of $($wanted.Count) files changed")
            [Console]::Out.Write(($need -join "`0"))
      # 2. Those files; the runner deletes what the tree no longer has (KEEP and PRESERVE stay).
      - task: ps
        vars:
          LABEL: "sync: the changed files"
          STDIN: 'tar -czf - -C "{{._ROOT}}" --null -T "{{._GIT_DIR}}/testor-sync.need"'
          SCRIPT: |
            $manifests = Join-Path (Split-Path $testorRun) "manifests"
            $pending = Join-Path $manifests "{{._PROJECT}}.pending.json"
            $wanted = Get-Content -Raw $pending | ConvertFrom-Json -AsHashtable
            $keep = @({{._KEEP}}) | Where-Object { $_ }
            $preserve = @({{._PRESERVE}}) | Where-Object { $_ } | ForEach-Object { $_ -replace "\\", "/" }
            $keepNames = @($keep | Where-Object { $_ -notmatch "/" })
            $keepPaths = @($keep | Where-Object { $_ -match "/" }) + @($preserve)
            if ("{{.CLEAN | default ""}}" -eq "1" -and (Test-Path $workspace)) {
              foreach ($p in $preserve) { Remove-Item -LiteralPath (Join-Path $workspace $p) -Recurse -Force -ErrorAction SilentlyContinue }
              $keepPaths = @($keep | Where-Object { $_ -match "/" })
            }
            function Clear-Stale($p, $rel) {
              Get-ChildItem -LiteralPath $p -Force | ForEach-Object {
                $r = if ($rel) { "$rel/$($_.Name)" } else { $_.Name }
                if ($_.Name -in $keepNames -or $r -in $keepPaths) { return }
                if ($_.PSIsContainer -and -not $_.LinkType) { Clear-Stale $_.FullName $r }
                elseif (-not $wanted.Contains($r)) { Remove-Item -LiteralPath $_.FullName -Force }
              }
            }
            if (Test-Path $workspace) { Clear-Stale $workspace "" }
            $null = New-Item -ItemType Directory -Force -Path $workspace
            tar -xzf - -C $workspace
            # Each file as it is now: the next sync trusts what has not changed since.
            $now = @{}
            foreach ($path in $wanted.Keys) {
              $item = Get-Item -LiteralPath (Join-Path $workspace $path) -Force -ErrorAction SilentlyContinue
              if ($item) { $now[$path] = @{ sha = $wanted[$path]; size = $item.Length; ticks = $item.LastWriteTimeUtc.Ticks } }
            }
            ConvertTo-Json -InputObject $now -Compress | Set-Content (Join-Path $manifests "{{._PROJECT}}.json")
            Remove-Item $pending

  sync-full:
    internal: true
    requires:
      vars: [RUNNER]
    cmds:
      - task: ps
        vars:
          LABEL: "sync {{._ROOT}} -> ~/{{._WORKSPACES}}/{{._PROJECT}}"
          STDIN: >-
            git -C "{{._ROOT}}" ls-files -z --cached --others --exclude-standard |
            tar -czf - -C "{{._ROOT}}" --null -T -
          SCRIPT: |
            # The manifest of a delta sync no longer says what is here.
            Remove-Item -LiteralPath (Join-Path (Join-Path (Split-Path $testorRun) "manifests") "{{._PROJECT}}.json") -ErrorAction SilentlyContinue
            # KEEP: names kept wherever they are (node_modules), or paths from the project's root
            # (a/b); PRESERVE: such paths too, unless CLEAN=1.
            $keep = @({{._KEEP}}) | Where-Object { $_ }
            $preserve = @({{._PRESERVE}}) | Where-Object { $_ } | ForEach-Object { $_ -replace "\\", "/" }
            $keepNames = @($keep | Where-Object { $_ -notmatch "/" })
            $keepPaths = @($keep | Where-Object { $_ -match "/" }) + @($preserve)
            if ("{{.CLEAN | default ""}}" -eq "1" -and (Test-Path $workspace)) {
              foreach ($p in $preserve) { Remove-Item -LiteralPath (Join-Path $workspace $p) -Recurse -Force -ErrorAction SilentlyContinue }
              $keepPaths = @($keep | Where-Object { $_ -match "/" })
            }
            function Clear-Snapshot($p, $rel) {
              Get-ChildItem -LiteralPath $p -Force | ForEach-Object {
                $r = if ($rel) { "$rel/$($_.Name)" } else { $_.Name }
                if ($_.Name -in $keepNames -or $r -in $keepPaths) { return }
                if ($_.PSIsContainer) { Clear-Snapshot $_.FullName $r } else { Remove-Item -LiteralPath $_.FullName -Force }
              }
            }
            if (Test-Path $workspace) { Clear-Snapshot $workspace "" }
            $null = New-Item -ItemType Directory -Force -Path $workspace
            tar -xzf - -C $workspace

  npm-ci:
    run: once
    cmds:
      # .lockhash is written last, so a failed install is retried on the next run.
      - task: exec
        vars:
          CMD: |
            if (Test-Path package-lock.json) {
              $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
              $prev = if (Test-Path .lockhash) { (Get-Content .lockhash -Raw).Trim() } else { "" }
              if ($hash -ne $prev -or -not (Test-Path node_modules)) { npm ci; Set-Content -NoNewline -Path .lockhash -Value $hash }
            }

  exec:
    requires:
      vars: [RUNNER, CMD]
    cmds:
      - task: ps
        vars:
          LABEL: "{{.KIND | default \"exec\"}}: {{.CMD | trim}}"
          SCRIPT: |
            Set-Location $workspace
            {{if .KIND}}$body = {
            {{.CMD}}
            }
            # One run of the project at a time (run.ps1's lock), unless LOCK=0; ISOLATE=copy runs
            # in a copy of its own instead, so runs overlap: the snapshot copied, KEEP folders
            # linked (a junction on Windows, a symbolic link elsewhere), deleted when it ends.
            $isolated = $null
            $env:TESTOR_LOCK = if ("{{.LOCK | default "1"}}" -eq "0" -or "{{.ISOLATE | default ""}}" -eq "copy") { "0" } else { "1" }
            if ("{{.ISOLATE | default ""}}" -eq "copy") {
              $isolatedRoot = Join-Path (Split-Path $testorRun) "isolated"
              $null = New-Item -ItemType Directory -Force $isolatedRoot
              # Left behind by a session that was killed: links first, never what they point to.
              foreach ($old in @(Get-ChildItem -LiteralPath $isolatedRoot -Directory | Where-Object { $_.Name -like "ssh-*" -and $_.LastWriteTime -lt (Get-Date).AddDays(-1) })) {
                Get-ChildItem -LiteralPath $old.FullName -Force | Where-Object LinkType | ForEach-Object { [IO.Directory]::Delete($_.FullName) }
                Remove-Item -LiteralPath $old.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }
              $isolated = Join-Path $isolatedRoot ("ssh-{{._PROJECT}}-" + [guid]::NewGuid().ToString("N").Substring(0, 8))
              $null = New-Item -ItemType Directory -Force $isolated
              $keep = @({{._KEEP}}) | Where-Object { $_ -and $_ -notmatch "/" }
              foreach ($item in Get-ChildItem -LiteralPath $workspace -Force) {
                $to = Join-Path $isolated $item.Name
                if ($item.PSIsContainer -and $item.Name -in $keep) {
                  if ($IsWindows) { $null = New-Item -ItemType Junction -Path $to -Target $item.FullName } else { $null = New-Item -ItemType SymbolicLink -Path $to -Target $item.FullName }
                } else { Copy-Item -LiteralPath $item.FullName -Destination $to -Recurse -Force }
              }
              Set-Location $isolated
            }
            try {
            if (Test-Path $testorRun) { & $testorRun -Project "{{._PROJECT}}" -Kind "{{.KIND}}"{{if .ARTIFACTS}} -Artifacts @({{range $i, $a := splitList " " (.ARTIFACTS | trim)}}{{if $a}}{{if $i}}, {{end}}'{{$a | replace "'" "''"}}'{{end}}{{end}}){{end}}{{if .TIMEOUT}} -TimeoutSeconds {{._TIMEOUT}}{{end}}{{if .MEMORY_GUARD}} -MemoryGuard '{{._MEMORY_GUARD}}'{{end}}{{if .REPORTS}} -Reports @({{range $i, $a := splitList " " (.REPORTS | trim)}}{{if $a}}{{if $i}}, {{end}}'{{$a | replace "'" "''"}}'{{end}}{{end}}){{end}} -Body $body } else { & $body }
            } finally {
              if ($isolated) {
                Set-Location $workspace
                Get-ChildItem -LiteralPath $isolated -Force | Where-Object LinkType | ForEach-Object { [IO.Directory]::Delete($_.FullName) }
                Remove-Item -LiteralPath $isolated -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            {{else}}{{.CMD}}
            {{end}}

  ps:
    internal: true
    requires:
      vars: [RUNNER, SCRIPT]
    cmds:
      - cmd: 'echo "[{{.RUNNER}}] {{.LABEL | default "script" | replace "\"" "''" | replace "\n" " " | trunc 200}}"'
        silent: true
      # The prelude and the script travel base64-encoded inside single quotes, which both a POSIX
      # shell and PowerShell (whichever is the runner's login shell) pass on as they are.
      - cmd: >-
          {{if .STDIN}}{{.STDIN}} | {{end}}ssh {{.RUNNER}}
          "pwsh -NoProfile -NonInteractive -Command '&([scriptblock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(\"{{b64enc (print ._PRELUDE .SCRIPT)}}\"))))'"{{if .OUT}} {{.OUT}}{{end}}
        silent: true
