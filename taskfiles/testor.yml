# Manages testor on a Windows runner, from the workstation. Include it from a Taskfile of
# your own (for example ~/Taskfile.yml) and name the runner, an SSH host:
#
#   includes:
#     testor:
#       taskfile: ~/git/testor/taskfiles/testor.yml
#       vars: { RUNNER: my-runner }
#
#   task testor:check     what setup.ps1 would still install on the runner
#   task testor:test      the orchestrator's ExUnit tests, on the runner
#   task testor:deploy    build and (re)start it; the dashboard is http://<runner>:6767
#   task testor:status / testor:logs / testor:uninstall
#
# Optional vars: PORT (6767), WORKSPACES (test-run, under the runner user's home), HOME_DIR
# (<WORKSPACES>\.testor), ALLOW_FROM (the firewall's remote addresses, comma separated;
# 100.64.0.0/10 is Tailscale's range).
version: "3"

# go-task gives an included Taskfile's own vars precedence over the ones passed to it, so the
# values computed here have names of their own (_PORT, ...) and read the caller's with defaults.
vars:
  _ROOT: "{{.TASKFILE_DIR}}/.."
  _PORT: '{{.PORT | default "6767"}}'
  _WORKSPACES: '{{.WORKSPACES | default "test-run"}}'
  _HOME_DIR: '{{.HOME_DIR | default (printf "%s\\.testor" ._WORKSPACES)}}'
  _ALLOW_FROM:
    sh: echo '{{.ALLOW_FROM | default "100.64.0.0/10,LocalSubnet"}}' | sed 's/[^,]*/"&"/g'

tasks:
  upload:
    internal: true
    requires:
      vars: [RUNNER]
    cmds:
      # The orchestrator and runner folders go to <home>\src; deps and _build stay there, so
      # builds are incremental. Sources removed here are removed there too.
      - >-
        tar -C "{{._ROOT}}" --exclude=_build --exclude=deps -czf - orchestrator runner |
        ssh {{.RUNNER}}
        '$src = "$HOME\{{._HOME_DIR}}\src"; $null = New-Item -ItemType Directory -Force -Path $src;
        foreach ($d in "runner", "orchestrator\lib", "orchestrator\priv", "orchestrator\test", "orchestrator\config", "orchestrator\rel") {
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $src $d) };
        tar -xzf - -C $src'

  check:
    desc: Report what the runner still lacks (runner/setup.ps1 -Check)
    requires:
      vars: [RUNNER]
    cmds:
      - >-
        tar -C "{{._ROOT}}/runner" -czf - setup.ps1 |
        ssh {{.RUNNER}}
        '$d = Join-Path $env:TEMP "testor-setup"; $null = New-Item -ItemType Directory -Force $d; tar -xzf - -C $d;
        & "$d\setup.ps1" -Check -Workspaces "$HOME\{{._WORKSPACES}}"; Remove-Item -Recurse -Force $d'

  test:
    desc: Run the orchestrator's ExUnit tests on the runner
    cmds:
      - task: upload
      - ssh {{.RUNNER}} '& "$HOME\{{._HOME_DIR}}\src\runner\install.ps1" -Test'

  deploy:
    desc: Build testor on the runner, install its scheduled task and firewall rule, and (re)start it
    cmds:
      - task: upload
      - ssh {{.RUNNER}} '& "$HOME\{{._HOME_DIR}}\src\runner\install.ps1" -Port {{._PORT}} -AllowFrom {{._ALLOW_FROM}}'

  status:
    desc: Show testor's scheduled task and health on the runner
    requires:
      vars: [RUNNER]
    cmds:
      - >-
        ssh {{.RUNNER}}
        'Get-ScheduledTask -TaskName Testor | Get-ScheduledTaskInfo | Select-Object LastRunTime, LastTaskResult | Format-List;
        try { Invoke-RestMethod http://127.0.0.1:{{._PORT}}/api/health | Format-List } catch { Write-Warning "not answering: $_" }'
      - curl -fsS --max-time 5 http://{{.RUNNER}}:{{._PORT}}/api/health && echo " <- reachable from $(hostname)"

  logs:
    desc: Print the end of testor's log on the runner
    requires:
      vars: [RUNNER]
    cmds:
      - ssh {{.RUNNER}} 'Get-Content -Tail 50 "$HOME\{{._HOME_DIR}}\testor.log"'

  uninstall:
    desc: Remove testor's scheduled task and firewall rule (keeps runs, logs and screenshots)
    requires:
      vars: [RUNNER]
    cmds:
      - ssh {{.RUNNER}} '& "$HOME\{{._HOME_DIR}}\src\runner\install.ps1" -Uninstall -Port {{._PORT}}'
