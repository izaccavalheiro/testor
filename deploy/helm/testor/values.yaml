# testor's state is files on one volume: one replica, replaced (not rolled) on upgrade.
image:
  repository: ghcr.io/izaccavalheiro/testor
  # Defaults to the chart's appVersion. Prefer a digest in production: digest: sha256:...
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Host names browsers and clients use (DNS rebinding protection). The ingress host and the
# service's cluster names are added; IP addresses always work.
allowedHosts: []
# Addresses or CIDR ranges of the ingress controller, so testor sees the client's address.
trustedProxies: []
# Who is answered while no user exists: loopback (default here: nothing outside the pod),
# private, or any.
anonymous: loopback
extraEnv: []

auth:
  # A Secret with a key "password" (12 characters or more): the admin user below is created or
  # its password reset at every start, so authentication is on from the first request.
  existingSecret: ""
  adminUser: admin

# Testors serving one team: more than one needs database.existingSecret and a volume every
# replica mounts (persistence.accessModes: [ReadWriteMany]: EFS, Filestore, Azure Files, NFS).
replicas: 1

# The job queue in PostgreSQL: a Secret with a key "url",
# postgres://testor:<password>@<host>:5432/testor?sslmode=verify-full. Jobs then outlive the
# pod and its volume, and testors sharing the database share the queue.
database:
  existingSecret: ""

# Built-in TLS: a kubernetes.io/tls Secret (tls.crt, tls.key), e.g. from cert-manager.
tls:
  existingSecret: ""

persistence:
  size: 10Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  type: ClusterIP
  port: 6767

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: testor.example.com
  tlsSecret: ""

networkPolicy:
  enabled: true
  # Who may reach the pod; the default is the ingress controller's namespace label.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # Egress: DNS, plus webhook endpoints (allow them here; none by default).
  egressTo: []

serviceMonitor:
  enabled: false
  # A Secret with a key "token": a Bearer token with the read scope (task testor:token).
  tokenSecret: ""
  interval: 30s

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Agents (runner/agent.ps1 in ghcr.io/izaccavalheiro/testor-agent): pods that take jobs from
# this testor and send their runs to it. Jobs must be on (execution.enabled in config.json).
# Build an image FROM the agent's with your projects' tools, and list its projects below.
agents:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/izaccavalheiro/testor-agent
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # A Secret with a key "token": a token of a user with the agent role (task testor:token).
  tokenSecret: ""
  # testor's address as agents reach it; by default its Service (https with built-in TLS: the
  # certificate must then name the Service, or set server to a name it holds).
  server: ""
  labels: [linux]
  # agent.json's projects: { "my-app": { "repository": "https://...", "commands": { "test": "..." },
  #   "secrets": { "NPM_TOKEN": "env:NPM_TOKEN", "DB": "file:/var/run/secrets/ci/db",
  #                "API": "vault:secret/data/ci#api" } } }  (docs/jobs.md, "Secrets")
  projects: {}
  # Where secrets come from: env (valueFrom secretKeyRef, for env: references), Secrets mounted
  # read-only (for file:), agent.json's vault (address, kubernetesRole...), and the agents'
  # ServiceAccount: its annotations give a cloud workload identity (aws:, gcp:, azure: through
  # their CLIs), and automountToken mounts its token (Vault's Kubernetes login).
  env: []
  secretMounts: []   # - { secret: ci-secrets, mountPath: /var/run/secrets/ci }
  vault: {}          # { address: https://vault.vault.svc:8200, kubernetesRole: testor-agent }
  serviceAccount:
    create: false
    name: ""
    annotations: {}
    automountToken: false
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Agent profiles: one Deployment (or, with mode: job, a KEDA ScaledJob: a Kubernetes Job per
  # run) per profile, each with its own labels, resources, /dev/shm, workspace size and scaling
  # on its own queue (testor_jobs{status="queued",label="<its last label>"}). They share the
  # image, token, projects, secrets and env above. Heavy kinds ask for a profile's label.
  #   - name: unit-light
  #     labels: [linux, unit]
  #     resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
  #     autoscaling: { keda: true, minReplicas: 0, maxReplicas: 10 }
  #   - name: e2e-browser
  #     labels: [linux, browser]
  #     shmSize: 1Gi
  #     resources: { requests: { cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi }, limits: { memory: 4Gi, ephemeral-storage: 20Gi } }
  #     autoscaling: { keda: true, minReplicas: 0, maxReplicas: 4 }
  #   - name: mutation-heavy
  #     labels: [linux, mutation]
  #     mode: job
  #     workspaceSizeLimit: 20Gi
  #     resources: { requests: { cpu: "4", memory: 8Gi }, limits: { memory: 8Gi } }
  #     autoscaling: { maxReplicas: 3 }
  profiles: []
  # KEDA scales agents on queued jobs (testor_jobs{status="queued"} from Prometheus).
  autoscaling:
    keda: false
    minReplicas: 0
    maxReplicas: 5
    prometheusServer: http://prometheus-server.monitoring.svc
    queuedPerAgent: 1
    # A KEDA trigger of your own instead of the Prometheus query, for a broker's queue length
    # (execution.queue): the scaler's pod identity reads queue depth only. For example
    #   trigger: { type: aws-sqs-queue, authenticationRef: { name: keda-sqs },
    #              metadata: { queueURL: "https://sqs.eu-west-1.amazonaws.com/1234/jobs.fifo", queueLength: "1", awsRegion: eu-west-1 } }
    #   trigger: { type: nats-jetstream, metadata: { natsServerMonitoringEndpoint: "nats.nats.svc:8222",
    #              account: "$G", stream: TESTOR, consumer: testor-testor_jobs_default, lagThreshold: "1" } }
    # A profile takes one in its own autoscaling.
    trigger: {}
