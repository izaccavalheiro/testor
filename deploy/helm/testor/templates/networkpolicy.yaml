{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "testor.fullname" . }}
  labels: {{- include "testor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "testor.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { port: http, protocol: TCP }
    {{- if .Values.agents.enabled }}
    # This release's agents, and its agent profiles'.
    - from:
        - podSelector:
            matchLabels: {{- include "testor.agentSelector" . | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "testor.agentProfileSelector" . | nindent 14 }}
      ports:
        - { port: http, protocol: TCP }
    {{- end }}
    {{- if .Values.tls.acme.httpPort }}
    # The ACME CA's HTTP-01 challenges, from anywhere.
    - ports:
        - { port: acme-http, protocol: TCP }
    {{- end }}
  egress:
    # DNS only, unless webhook endpoints are allowed in networkPolicy.egressTo.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if .Values.tls.acme }}
    # The ACME CA's API (HTTPS).
    - ports:
        - { port: 443, protocol: TCP }
    {{- end }}
    {{- with .Values.networkPolicy.egressTo }}
    - to: {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
