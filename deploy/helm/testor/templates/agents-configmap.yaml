{{- if .Values.agents.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "testor.fullname" . }}-agent
  labels: {{- include "testor.labels" . | nindent 4 }}
data:
  agent.json: |
    {{- dict "server" (include "testor.agentServer" .) "home" "/home/agent/testor" "upload" true "labels" .Values.agents.labels "projects" .Values.agents.projects | toPrettyJson | nindent 4 }}
{{- end }}
