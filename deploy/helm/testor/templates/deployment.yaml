apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testor.fullname" . }}
  labels: {{- include "testor.labels" . | nindent 4 }}
spec:
  {{- if and .Values.tls.existingSecret .Values.tls.acme }}{{ fail "tls.existingSecret and tls.acme: choose one source of certificates" }}{{ end }}
  {{- $s3 := .Values.storage.s3.bucket }}
  {{- if and (not .Values.persistence.enabled) (not $s3) }}{{ fail "persistence.enabled: false needs storage.s3 (else the runs go with the pod)" }}{{ end }}
  {{- if gt (int .Values.replicas) 1 }}
  {{- if not .Values.database.existingSecret }}{{ fail "replicas > 1 needs database.existingSecret (the queue and claims in PostgreSQL)" }}{{ end }}
  {{- if and (not $s3) (not (has "ReadWriteMany" .Values.persistence.accessModes)) }}{{ fail "replicas > 1 needs storage.s3, or persistence.accessModes [ReadWriteMany] (one home for every replica)" }}{{ end }}
  {{- if and $s3 (not .Values.keys.existingSecret) }}{{ fail "replicas > 1 with storage.s3 needs keys.existingSecret (the keys every replica signs with)" }}{{ end }}
  # Several testors on one database: one home (Testor.Cluster), or none (Testor.Storage.Shared).
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
  {{- else }}
  # One process owns the files on the volume: never two at once.
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "testor.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "testor.selector" . | nindent 8 }}
      annotations:
        # A change of config.json rolls the pods: it is read when testor starts.
        checksum/config: {{ include "testor.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "testor.fullname" . }}
      automountServiceAccountToken: false
      # No Kubernetes service links: a Service named testor would set TESTOR_PORT and the like
      # (tcp://...), which testor reads as its own settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.auth.existingSecret }}
      initContainers:
        # Authentication on from the first request: the admin user, with the Secret's password.
        - name: admin-user
          image: {{ include "testor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["eval", "Testor.Auth.CLI.user ~s[{{ .Values.auth.adminUser }}], ~s[admin]"]
          env:
            - name: TESTOR_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.auth.existingSecret }}, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.tls.existingSecret }}
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- end }}
      {{- end }}
      containers:
        - name: testor
          image: {{ include "testor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 6767, protocol: TCP }
            {{- with .Values.tls.acme.httpPort }}
            - { name: acme-http, containerPort: {{ . }}, protocol: TCP }
            {{- end }}
          env:
            - { name: TESTOR_ALLOWED_HOSTS, value: {{ include "testor.allowedHosts" . | quote }} }
            - { name: TESTOR_TRUSTED_PROXIES, value: {{ join "," .Values.trustedProxies | quote }} }
            - { name: TESTOR_ANONYMOUS, value: {{ .Values.anonymous | quote }} }
            # Each replica's name: its own audit trail (audit.<instance>.jsonl).
            - name: TESTOR_INSTANCE
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- with .Values.database.existingSecret }}
            # The job queue in PostgreSQL (Testor.Jobs.Postgres).
            - name: TESTOR_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ . }}, key: url } }
            {{- end }}
            {{- if or .Values.config .Values.storage.s3.bucket }}
            # config.json from the chart (templates/configmap.yaml).
            - { name: TESTOR_CONFIG_FILE, value: /etc/testor/config.json }
            {{- end }}
            {{- with .Values.storage.s3.existingSecret }}
            # The bucket's credentials (docs/storage.md); else IRSA or workload identity.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ . }}, key: access-key-id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: secret-access-key } }
            {{- end }}
            {{- with .Values.keys.existingSecret }}
            # One set of keys for every replica: tokens, sessions and attestations hold on each.
            - name: TESTOR_TOKEN_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: token-key } }
            - name: TESTOR_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: signing-key } }
            - name: TESTOR_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ . }}, key: jwt-secret } }
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - { name: TESTOR_TLS_CERT, value: /tls/tls.crt }
            - { name: TESTOR_TLS_KEY, value: /tls/tls.key }
            {{- end }}
            {{- with .Values.tls.acme }}
            # Certificates from ACME (Testor.Acme).
            - { name: TESTOR_ACME, value: {{ toJson . | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The probes ask by the pod's IP address, which the Host allow-list always accepts.
          readinessProbe:
            httpGet: { path: /api/health, port: http, scheme: {{ include "testor.scheme" . }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http, scheme: {{ include "testor.scheme" . }} }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            {{- if or .Values.config .Values.storage.s3.bucket }}
            - { name: config, mountPath: /etc/testor, readOnly: true }
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "testor.fullname" .) }}
          {{- else }}
          # A cache of the bucket: cacheMB of stored runs, and the runs in progress.
          emptyDir: { sizeLimit: {{ add (int .Values.storage.s3.cacheMB) 2048 }}Mi }
          {{- end }}
        {{- if or .Values.config .Values.storage.s3.bucket }}
        - name: config
          configMap: { name: {{ include "testor.fullname" . }}-config }
        {{- end }}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret: { secretName: {{ .Values.tls.existingSecret }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
