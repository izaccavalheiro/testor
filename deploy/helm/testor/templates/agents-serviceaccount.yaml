{{- if and .Values.agents.enabled .Values.agents.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testor.fullname" . }}-agent
  labels: {{- include "testor.labels" . | nindent 4 }}
  {{- with .Values.agents.serviceAccount.annotations }}
  # A cloud workload identity (eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account,
  # azure.workload.identity/client-id) for the secrets agents read through their CLIs.
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.agents.serviceAccount.automountToken }}
{{- end }}
