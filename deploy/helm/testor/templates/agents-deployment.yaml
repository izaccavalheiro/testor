{{- if .Values.agents.enabled }}
{{- if not .Values.agents.tokenSecret }}{{ fail "agents.tokenSecret: a Secret with the agent's token" }}{{ end }}
{{- range $g := (include "testor.agentGroups" . | fromJsonArray) }}
{{- if eq $g.mode "deployment" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testor.fullname" $ }}-agent{{ $g.suffix }}
  labels: {{- include "testor.labels" $ | nindent 4 }}
spec:
  {{- if not $g.autoscaling.keda }}
  replicas: {{ $g.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "testor.agentGroupSelector" (dict "root" $ "group" $g) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "testor.agentGroupSelector" (dict "root" $ "group" $g) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/agents-configmap.yaml") $ | sha256sum }}
    spec: {{- include "testor.agentPodSpec" (dict "root" $ "group" $g) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
